<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playboy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #4facfe, #00f2fe);
            background-size: 400% 400%;
            animation: shift 15s infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        @keyframes shift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        .box {
            width: 320px;
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .logo { font-size: 1.6em; font-weight: bold; background: linear-gradient(135deg, #ff006e, #ffbe0b, #3a86ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .title { font-size: 1.1em; color: #333; margin-bottom: 10px; font-weight: bold; }
        .desc { font-size: 0.75em; color: #666; margin-bottom: 10px; }
        
        .btn-box {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            transition: 0.3s;
        }
        .btn-box:hover { transform: scale(1.02); }
        .btn-box-green { background: linear-gradient(135deg, #22c55e, #16a34a); }
        
        .logo-sm { width: 30px; height: 30px; color: white; margin: 0 auto 3px; }
        .text-sm { color: white; font-size: 0.8em; font-weight: 600; margin-bottom: 3px; }
        .btn { 
            display: inline-block; 
            color: white; 
            text-decoration: none; 
            font-size: 0.8em; 
            padding: 5px 12px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 5px; 
            border: 1px solid white; 
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background: white; color: #0099ff; }
        .btn-green:hover { color: #16a34a; }
        
        .timer-box {
            background: #f0f0f0;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        #timer { font-size: 1.5em; font-weight: bold; background: linear-gradient(135deg, #ff006e, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .timer-label { font-size: 0.75em; color: #888; font-weight: 600; }
        
        .redirect { font-size: 0.7em; color: #999; margin-top: 5px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .footer { font-size: 0.65em; color: #ccc; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">🎉 PLAYBOY</div>
        <div class="title">Join Us</div>
        <p class="desc">Exclusive content & updates</p>
        
        <div class="btn-box">
            <svg class="logo-sm" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="2"/>
                <path d="M8 12L16 8M8 12L16 16M8 12L11 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <p class="text-sm">Join Telegram</p>
            <a href="https://t.me/+Xl6QcJluS9w1YzM9" class="btn">Click</a>
        </div>

        <div class="timer-box">
            <span id="timer">10</span>
            <span class="timer-label">sec</span>
        </div>

        <div class="btn-box btn-box-green">
            <svg class="logo-sm" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="2"/>
                <path d="M8 12L16 8M8 12L16 16M8 12L11 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <p class="text-sm">Join Channel</p>
            <a href="https://t.me/+Xl6QcJluS9w1YzM9" class="btn btn-green">Go</a>
        </div>

        <p class="redirect">⏳ Redirecting...</p>
        <div class="footer">© 2024 Playboy</div>
    </div>

    <script>
        let t = 10;
        setInterval(() => {
            t--;
            document.getElementById('timer').textContent = t;
            if (t <= 0) window.location.href = 'https://t.me/+Xl6QcJluS9w1YzM9';
        }, 1000);
        
        document.querySelectorAll('.btn').forEach(b => b.addEventListener('click', e => {
            e.preventDefault();
            window.location.href = 'https://t.me/+Xl6QcJluS9w1YzM9';
        }));
    </script>
</body>
</html>
